<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="21 15 32 32"><style>svg{--ink:#ece3d0;--stone:#8e8597;--gold:#e3b341;--goldDark:#8a6510;--goldLight:#f7dc8a;--blood:#c8283f;--bloodLight:#f06a7c;--bloodDark:#7d1222;--lit:#f1e7c8;--track:rgba(236,227,208,.16);--shadow:rgba(10,8,12,.7)}
text{font-family:Palatino,'Palatino Linotype','Book Antiqua',Georgia,serif;font-variant-numeric:tabular-nums lining-nums}
.v{font-size:23px;font-weight:600;letter-spacing:.01em}
.c{font-size:19.7px;fill:var(--stone)}
rect{shape-rendering:crispEdges}
.drip{animation:drip .5s ease-out}
@keyframes drip{from{opacity:.15}to{opacity:1}}
@keyframes flapA{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes flapB{0%,49.9%{opacity:0}50%,100%{opacity:1}}
.up{animation:flapA .36s steps(1) infinite}.down{opacity:0;animation:flapB .36s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.drip{animation:none}.up{animation:none}.down{animation:none;opacity:0}}
</style><rect x="21" y="15" width="32" height="32" rx="5" fill="#1d1528"/><g transform="translate(22 0)"><title>5h limit: 12% used.</title>
<circle cx="15" cy="31" r="14.5" fill="var(--shadow)" stroke="var(--stone)" stroke-width=".8"/>
<defs><clipPath id="lit"><path d="M15 16.5A14.5 14.5 0 0 0 15 45.5A2.90 14.5 0 0 0 15 16.5Z"/></clipPath><radialGradient id="limb" cx="42%" cy="40%" r="62%"><stop offset="55%" stop-color="#3a2a14" stop-opacity="0"/><stop offset="100%" stop-color="#3a2a14" stop-opacity=".45"/></radialGradient></defs>
<g clip-path="url(#lit)"><circle cx="15" cy="31" r="14.5" fill="var(--lit)"/><circle cx="10.7" cy="26.9" r="3.2" fill="#8a7a5c" fill-opacity=".38"/><circle cx="19.1" cy="32.7" r="2.5" fill="#8a7a5c" fill-opacity=".38"/><circle cx="13.3" cy="37.1" r="1.9" fill="#8a7a5c" fill-opacity=".38"/><circle cx="20.8" cy="25.2" r="1.5" fill="#8a7a5c" fill-opacity=".38"/><circle cx="7.8" cy="32.5" r="1.3" fill="#8a7a5c" fill-opacity=".38"/><circle cx="15" cy="31" r="14.5" fill="url(#limb)"/></g>
<path d="M15 16.5A14.5 14.5 0 0 0 15 45.5A2.90 14.5 0 0 0 15 16.5Z" fill="none" stroke="var(--stone)" stroke-width=".6"/>
<text x="40" y="27"><tspan class="v" fill="var(--ink)">12%</tspan><tspan class="c" dx="8">5hr reset</tspan></text>
<text x="40" y="50" class="c">3h 0m to 21:00</text></g></svg>